name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes agulhas tests
      - name: Test
        run: python -W ignore -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t agulhas .
      - name: Test in the image
        run: docker run --rm agulhas python -W ignore -m pytest -q
